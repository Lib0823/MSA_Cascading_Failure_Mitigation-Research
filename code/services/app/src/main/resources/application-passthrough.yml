# WORKLOAD=passthrough 노드. DB 를 쓰지 않으므로 DataSource 자동설정을 끈다.

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

app:
  passthrough:
    # 장애 주입은 FaultInjectionFilter 가 전 노드에 동일하게 적용한다 (FAULT_DELAY_MILLIS).
    timeoutMillis: ${PASSTHROUGH_TIMEOUT_MS:5000}
