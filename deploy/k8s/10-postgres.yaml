# S1 의 병목이 여기 있다. 앱이 아니라 **DB 쪽**이어야 한다 (§4-5).
#
# max_connections 규칙: 2 × poolSize < max_connections < 4 × poolSize
#   게이트 ①.5 실측 — 25 에서는 2 인스턴스만으로 고갈되어 "인스턴스↑ → 커넥션
#   요구↑ → 상한 도달" 이라는 서술된 기전이 나타나지 않았다. 풀 20 기준 50 이 적정.

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: cascade
data:
  initDb.sql: |
    -- 앱은 superuser 로 붙지 않는다. superuser 면 superuser_reserved_connections
    -- 까지 먹어, 커넥션이 고갈된 순간 관측용 psql 도 접속하지 못한다.
    -- 게이트 ①.5 에서 실제로 그 문제를 겪었다.
    CREATE ROLE appuser LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cascade
spec:
  clusterIP: None          # StatefulSet 용 헤드리스
  selector:
    app: postgres
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cascade
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          args:
            - postgres
            - -c
            - max_connections=$(DB_MAX_CONNECTIONS)
            - -c
            - shared_buffers=256MB
            - -c
            # 관측용 psql 이 쓸 슬롯. 앱이 비-superuser 라 여기에 손대지 못한다.
            - superuser_reserved_connections=3
          env:
            - name: POSTGRES_DB
              value: cascade
            - name: POSTGRES_USER
              value: cascade
            # 실험 전용 클러스터이며 포트를 외부로 노출하지 않는다. 비밀번호를 두면
            # 하드코딩 리터럴만 남고 하는 일이 없다 (2026-09-27 결정).
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: DB_MAX_CONNECTIONS
              value: "50"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cascade", "-d", "cascade"]
            initialDelaySeconds: 5
            periodSeconds: 3
      volumes:
        - name: init
          configMap:
            name: postgres-init
        # 내구성이 필요 없는 실험 DB 다. emptyDir 로 두면 파드 재시작마다 초기화되어
        # 에피소드 간 상태 오염이 원천 차단된다.
        - name: data
          emptyDir: {}
