# 로컬 클러스터(minikube) 전용 — 호스트에서 클러스터 안으로 들어오는 경로.
#
# 기본 매니페스트(20-services.yaml)의 Service 는 전부 ClusterIP 다. 그것은 건드리지 않고,
# 외부 접속 전용 NodePort 를 따로 둔다. 운영 환경이라면 Ingress 나 LoadBalancer 를 쓸
# 자리이며, 이 파일은 kubeadm 실험 머신(게이트 ②)에서도 같은 역할로 쓸 수 있다.
#
# 포트는 Compose 의 18091~18093 과 끝자리를 맞췄다 — 하니스의 NODE_ENDPOINTS 를
# 호스트 IP 만 바꿔 재사용할 수 있게 하기 위해서다.
#
# ⚠️ 레플리카가 2 이상이면 이 경로로는 **파드 하나**만 보인다. NodePort 는 요청마다
#    파드를 고르므로, 노드별 지표 수집이나 장애 주입을 이 경로로 하면 조용히 틀린다.
#    레플리카 1 일 때만 쓰고, 증설 실험에서는 Prometheus 를 쓴다.
apiVersion: v1
kind: Service
metadata:
  name: gateway-external
  namespace: cascade
  labels: {access: external}
spec:
  type: NodePort
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30091, name: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: order-external
  namespace: cascade
  labels: {access: external}
spec:
  type: NodePort
  selector: {app: order}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30092, name: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-external
  namespace: cascade
  labels: {access: external}
spec:
  type: NodePort
  selector: {app: payment}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30093, name: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-external
  namespace: cascade
  labels: {access: external}
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090, nodePort: 30090, name: http}]
