# Compose 등가 토폴로지 — code/chain/docker-compose.yml 을 한 줄씩 옮긴 것이다.
#
#   부하 → gateway → orders → payment → db
#
# 왜 별도 매니페스트인가 (2026-11-22, research/challenges.md J30)
# ================================================================
# 기본 매니페스트(20-services.yaml)는 §4-1 의 6노드 토폴로지다. 그런데 기존 실험 데이터
# (원장 48셀)는 전부 Compose 3노드에서 나왔다. 두 결과를 비교하려면 **오케스트레이터
# 말고는 아무것도 다르면 안 된다** — 같은 이미지(config 다이제스트 일치를 확인했다),
# 같은 토폴로지, 같은 환경 변수, 같은 자원 한도.
#
# 그래서 이 파일은 docker-compose.yml 을 원본으로 삼는다. `${VAR:-default}` 도 Compose 와
# 같은 의미로 치환된다(code/chain/k8sBackend.py `render`). **같은 환경 변수 딕셔너리가
# 두 백엔드를 구동**하므로 파라미터가 어긋날 여지가 없다.
#
# Compose 와 다르게 둔 것 — 셋, 전부 라우팅·기동에 관한 것이다
# ================================================================
# ① readinessProbe 는 `/actuator/health/readiness` 다. 전체 헬스는 `db` 지표를 포함해
#    DB 커넥션을 못 얻으면 9초 만에 파드를 Service 에서 뺀다(실측, J30). Compose 의
#    healthcheck 는 기동 순서에만 쓰이고 라우팅에는 영향이 없었으므로, **라우팅에
#    영향이 없는 쪽**이 등가다.
# ② enableServiceLinks: false. K8s 는 Service 마다 `DB_PORT=tcp://…` 같은 환경 변수를
#    주입한다. 이름이 `db` 인 Service 가 `DB_PORT` 를 만들고, Spring 의 relaxed binding 이
#    그것을 설정으로 읽을 수 있다. Compose 는 이런 변수를 넣지 않는다.
# ③ depends_on 이 없다. 대신 하니스가 parity.cascade/order 라벨 순서로 적용하고 단계마다
#    Ready 를 기다린다 — db → payment → orders → gateway.
#
# 자원 requests 는 스케줄링에만 쓰인다(단일 노드). 측정에 영향을 주는 limits 는 Compose 의
# `cpus`·`mem_limit` 과 같다 — 둘 다 cgroup v2 의 cpu.max·memory.max 로 강제된다.
apiVersion: v1
kind: Namespace
metadata:
  name: cascade-parity
  labels: {parity.cascade/order: "0"}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: cascade-parity
  labels: {app: db, parity.cascade/order: "1"}
spec:
  selector: {app: db}
  ports: [{port: 5432, targetPort: 5432, name: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: cascade-parity
  labels: {app: db, parity.cascade/order: "1"}
spec:
  serviceName: db
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata:
      labels: {app: db}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - max_connections=${DB_MAX_CONNECTIONS:-400}
            - -c
            - shared_buffers=128MB
            - -c
            - superuser_reserved_connections=3
          env:
            - {name: POSTGRES_DB, value: "${DB_NAME:-cascade}"}
            - {name: POSTGRES_USER, value: "${DB_USER:-cascade}"}
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
          ports: [{containerPort: 5432, name: postgres}]
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {cpu: "${DB_CPUS:-2.0}", memory: 1Gi}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U ${DB_USER:-cascade} -d ${DB_NAME:-cascade}"]
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: init
          configMap: {name: db-init}
        # Compose 의 tmpfs 와 같다 — 셀마다 빈 DB 로 시작하고, 페이지가 컨테이너
        # 메모리 cgroup 에 함께 잡힌다.
        - name: data
          emptyDir: {medium: Memory}
---
# 사슬 끝. S1 의 주입 지점이자, S3 에서는 FAULT_DELAY_MILLIS 로 느려지는 노드다.
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: cascade-parity
  labels: {app: payment, parity.cascade/order: "2"}
spec:
  selector: {app: payment}
  ports: [{port: 8080, targetPort: 8080, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: cascade-parity
  labels: {app: payment, parity.cascade/order: "2"}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment}}
  template:
    metadata:
      labels: {app: payment}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: app
          image: cascade-app:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SERVICE_NAME, value: payment}
            - {name: WORKLOAD, value: db}
            - {name: DB_URL, value: "jdbc:postgresql://db:5432/${DB_NAME:-cascade}"}
            - {name: DB_USER, value: "${DB_APP_USER:-appuser}"}
            - {name: HIKARI_MAX_POOL_SIZE, value: "${HIKARI_MAX_POOL_SIZE:-20}"}
            - {name: HIKARI_MIN_IDLE, value: "${HIKARI_MIN_IDLE:-2}"}
            - {name: HIKARI_CONNECTION_TIMEOUT_MS, value: "${HIKARI_CONNECTION_TIMEOUT_MS:-1000}"}
            - {name: DB_SLEEP_MILLIS, value: "${DB_SLEEP_MILLIS:-60}"}
            - {name: DB_BURN_ROWS, value: "${DB_BURN_ROWS:-1000}"}
            - {name: FAULT_DELAY_MILLIS, value: "${PAYMENT_FAULT_DELAY_MILLIS:-0}"}
          ports: [{containerPort: 8080, name: http}]
          resources:
            requests: {cpu: "100m", memory: 384Mi}
            limits: {cpu: "${APP_CPUS:-1.0}", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: cascade-parity
  labels: {app: orders, parity.cascade/order: "3"}
spec:
  selector: {app: orders}
  ports: [{port: 8080, targetPort: 8080, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: cascade-parity
  labels: {app: orders, parity.cascade/order: "3"}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata:
      labels: {app: orders}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: app
          image: cascade-app:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SERVICE_NAME, value: orders}
            - {name: WORKLOAD, value: passthrough}
            - {name: DOWNSTREAM, value: "http://payment:8080"}
            - {name: PASSTHROUGH_TIMEOUT_MS, value: "${PASSTHROUGH_TIMEOUT_MS:-10000}"}
            - {name: FAULT_DELAY_MILLIS, value: "0"}
            # 조치 파라미터. Bulkhead 한도는 장애 중 가용 커넥션 수 이하여야 한다.
            - {name: BULKHEAD_MAX_CONCURRENT, value: "${BULKHEAD_MAX_CONCURRENT:-6}"}
            - {name: BULKHEAD_MAX_WAIT_MS, value: "${BULKHEAD_MAX_WAIT_MS:-3000}"}
            - {name: CB_SLOW_CALL_MS, value: "${CB_SLOW_CALL_MS:-400}"}
            - {name: RETRY_MAX_ATTEMPTS, value: "${RETRY_MAX_ATTEMPTS:-3}"}
            - {name: RETRY_WAIT_MS, value: "${RETRY_WAIT_MS:-50}"}
          ports: [{containerPort: 8080, name: http}]
          resources:
            requests: {cpu: "100m", memory: 384Mi}
            limits: {cpu: "${APP_CPUS:-1.0}", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cascade-parity
  labels: {app: gateway, parity.cascade/order: "4"}
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cascade-parity
  labels: {app: gateway, parity.cascade/order: "4"}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: app
          image: cascade-app:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SERVICE_NAME, value: gateway}
            - {name: WORKLOAD, value: passthrough}
            - {name: DOWNSTREAM, value: "http://orders:8080"}
            - {name: PASSTHROUGH_TIMEOUT_MS, value: "${PASSTHROUGH_TIMEOUT_MS:-10000}"}
            - {name: FAULT_DELAY_MILLIS, value: "0"}
          ports: [{containerPort: 8080, name: http}]
          resources:
            requests: {cpu: "100m", memory: 384Mi}
            limits: {cpu: "${APP_CPUS:-1.0}", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 2
            failureThreshold: 3
---
# 호스트 → 클러스터 경로. Compose 의 18091~18093 과 끝자리를 맞췄다.
# ⚠️ 레플리카가 2 이상이면 이 경로로는 파드 하나만 보인다 — 노드별 수집·장애 주입은
#    레플리카 1 일 때만 이 경로로 하고, 증설된 노드는 하니스가 파드별로 다룬다.
apiVersion: v1
kind: Service
metadata:
  name: gateway-external
  namespace: cascade-parity
  labels: {access: external, parity.cascade/order: "5"}
spec:
  type: NodePort
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080, nodePort: 31091, name: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: orders-external
  namespace: cascade-parity
  labels: {access: external, parity.cascade/order: "5"}
spec:
  type: NodePort
  selector: {app: orders}
  ports: [{port: 8080, targetPort: 8080, nodePort: 31092, name: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-external
  namespace: cascade-parity
  labels: {access: external, parity.cascade/order: "5"}
spec:
  type: NodePort
  selector: {app: payment}
  ports: [{port: 8080, targetPort: 8080, nodePort: 31093, name: http}]
