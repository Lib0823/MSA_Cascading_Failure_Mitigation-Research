rules:
  # ----- 정합성 규칙 (properties.md C, 설계 불변식) -----
  - entity: SafetyGuard
    text: "SafetyGuard derivedFrom CostFunction는 필수 — 하드코딩 규칙으로 정의되면 위반(G4 철학)"
    confidence: EXTRACTED
    manual: false
  - entity: K8sScaleUp
    text: "K8sScaleUp만 isProvisioning=true이고 나머지 4종 Actuator는 false — FIRM 대비 신규 기여 근거"
    confidence: EXTRACTED
    manual: false
  - entity: RelatedWork
    text: "모든 RelatedWork(GRAF/FIRM/AGQ/GraphGRU)는 Axis_ConfidenceTieredResponse를 lacksAxis — 셋 다 비운 유일 축(신규 기여)"
    confidence: EXTRACTED
    manual: false
  - entity: TemporalStatisticFeature
    text: "temporalWindowBeforeT=true — 라벨창 [t,t+Δ]과 겹치면 라벨 누수(위반)"
    confidence: EXTRACTED
    manual: false
  - entity: GroundTruthLabel
    text: "GroundTruthLabel excludesFeature(self-SLO 위반 이력) — self-SLO feature 포함 시 위상 우회(위반)"
    confidence: EXTRACTED
    manual: false
  - entity: EffectiveRisk
    text: "EffectiveRisk = max(0, p̄_v − κ√u_v)이고 비용식의 p는 반드시 이 값 — p를 '1−분산'으로 두면 위반(G4 버그 정정)"
    confidence: EXTRACTED
    manual: false
  - entity: EvaluationMetric
    text: "FailureProbability는 ECE로, Uncertainty는 DropRate로 — 두 축은 분리 검증(뭉뚱그리면 위반, H3)"
    confidence: EXTRACTED
    manual: false

  # ----- 핵심 설계 콜아웃 (classes.md/individuals.md 주석) -----
  - entity: ServiceCallGraph
    text: "위상(ServiceCallGraph)은 정적. Pod 증감 등 물리적 변화는 그래프 구조가 아니라 NodeFeature로 흡수(우려13). 위상 변경은 fine-tune으로 대응"
    confidence: EXTRACTED
    manual: false
  - entity: Actuator
    text: "조치 이질성 축: ReadRedirection(기능유지+일관성약화) ≠ Brownout(기능생략) ≠ TrafficShedding(요청거부). isProvisioning으로 K8sScaleUp(프로비저닝)만 나머지 4종과 구분"
    confidence: EXTRACTED
    manual: false
  - entity: TemporalStatisticFeature
    text: "TA-GAT은 신규 모델이 아니라 feature 설계(브랜딩 라벨). GAT의 하위 클래스가 아니라 TemporalStatisticFeature로 표현"
    confidence: EXTRACTED
    manual: false
  - entity: K8sScaleUp_i
    text: "K8sScaleUp은 상태성 병목(ConnectionPool)에서 Thundering Herd를 유발(inducedBy 역효과) → 커넥션풀에서 Var_m 급락, θ_scaleup 분모 음수 → 비용함수가 ScaleUp 자동 배제, CB/Redirection 선택"
    confidence: EXTRACTED
    manual: false
  - entity: CircuitBreaker_i
    text: "컷 우선순위: 시간 부족 시 CircuitBreaker+ReadRedirection 2종만 실증, 나머지는 확장 가능 설계로 남김. Brownout은 앱 계측 필요로 컷 1순위"
    confidence: EXTRACTED
    manual: false
  - entity: OnlineBoutique
    text: "cartservice hasBackingStore=Redis(replica 성립) vs productcatalogservice hasBackingStore=로컬JSON(복제본 불가 → Read Redirection 타깃 아님, H2 교정)"
    confidence: EXTRACTED
    manual: false

  # ----- 심사 우려 대응 (individuals.md §10) -----
  - entity: Concern6
    text: "왜 작은 벤치마크? → 선행 전례 + 의도적 스코프 + 공유 per-node head 확장성(D13)"
    confidence: EXTRACTED
    manual: false
  - entity: Concern7
    text: "FIRM과 뭐가 다른가? → 위상 미반영 + 신뢰도구간 없음 + 비프로비저닝 조치(D14)"
    confidence: EXTRACTED
    manual: false
  - entity: Concern8
    text: "왜 정적 GAT(시계열 결합 아님)? → 문제정의 다름(분류/신뢰도) + TA-GAT feature 보강 + ablation"
    confidence: EXTRACTED
    manual: false
  - entity: Concern9
    text: "왜 Deep Ensemble(MC Dropout 아님)? → Lakshminarayanan 2017 선례 + 병렬추론 지연 우위"
    confidence: EXTRACTED
    manual: false
  - entity: Concern10
    text: "그래프 커지면 학습 오래? → GAT sparse O(N+E) + 공유 head + 진짜 병목은 실측 수집"
    confidence: EXTRACTED
    manual: false
  - entity: Concern11
    text: "즉각조치를 느린 GNN에 묶으면? → 2계층(Tier1 반사)으로 분리"
    confidence: EXTRACTED
    manual: false
  - entity: Concern12
    text: "N=5 앙상블이 골든타임 안에? → 골든타임에 GNN 없음(Tier2 전용) + GRAF 6.7s 기준선 + 병렬추론"
    confidence: EXTRACTED
    manual: false
  - entity: Concern13
    text: "정적 위상이 변하는 MSA에 유효? → 논리 위상은 안정적 + 물리 변화는 feature로 흡수 + fine-tune(FIRM 전이학습 선례)"
    confidence: EXTRACTED
    manual: false

