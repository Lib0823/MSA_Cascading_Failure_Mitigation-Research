<?xml version="1.0" encoding="UTF-8"?>
<!-- 그림 1. 제안 구조 — draft-spring2027.md §3.1. 학회 양식에 옮길 때 그대로 쓰거나 다시 그린다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>

  <!-- 계층 1: 예측 -->
  <rect x="20" y="20" width="210" height="150" rx="8" fill="#f2f5fa" stroke="#3a5a8c" stroke-width="1.6"/>
  <text x="125" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1f3556">예측 계층</text>
  <text x="125" y="76" text-anchor="middle" font-size="13" fill="#222">GBM 앙상블 (N = 5)</text>
  <text x="125" y="97" text-anchor="middle" font-size="13" fill="#222">자기 특징 + 이웃 집계</text>
  <text x="125" y="118" text-anchor="middle" font-size="13" fill="#222">멤버별 확률 보정</text>
  <text x="125" y="152" text-anchor="middle" font-size="13" fill="#555">출력: 위험 p̄ · 불확실성 u · 유형 ŝ</text>

  <!-- 계층 2: 의사결정 -->
  <rect x="275" y="20" width="250" height="150" rx="8" fill="#fbf6ee" stroke="#9a6b1f" stroke-width="1.6"/>
  <text x="400" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#5a3d0e">의사결정 계층 (Policy Engine)</text>
  <text x="400" y="78" text-anchor="middle" font-size="13" fill="#222">θ<tspan font-size="10" baseline-shift="sub">a</tspan> = D<tspan font-size="10" baseline-shift="sub">a</tspan>R<tspan font-size="10" baseline-shift="sub">a</tspan> / (m<tspan font-size="10" baseline-shift="sub">a</tspan>L − D<tspan font-size="10" baseline-shift="sub">a</tspan>(1 − R<tspan font-size="10" baseline-shift="sub">a</tspan>))</text>
  <text x="400" y="102" text-anchor="middle" font-size="13" fill="#222">p<tspan font-size="10" baseline-shift="sub">eff</tspan> = max(0, p̄ − κ√u)</text>
  <text x="400" y="126" text-anchor="middle" font-size="13" fill="#222">ℓ<tspan font-size="10" baseline-shift="sub">a</tspan> &lt; L<tspan font-size="10" baseline-shift="sub">pred</tspan> 인 조치 중 기대비용 최소</text>
  <text x="400" y="152" text-anchor="middle" font-size="13" fill="#555">보류보다 낮지 않으면 보류</text>

  <!-- 계층 3: 실행 -->
  <rect x="570" y="20" width="170" height="150" rx="8" fill="#f1f8f3" stroke="#2f7a45" stroke-width="1.6"/>
  <text x="655" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4d2b">실행 계층</text>
  <text x="655" y="78" text-anchor="middle" font-size="13" fill="#222">CB · 벌크헤드</text>
  <text x="655" y="97" text-anchor="middle" font-size="13" fill="#555">→ 위험 노드의 호출자</text>
  <text x="655" y="126" text-anchor="middle" font-size="13" fill="#222">증설</text>
  <text x="655" y="145" text-anchor="middle" font-size="13" fill="#555">→ 위험 노드 자신</text>

  <!-- 계층 사이 화살표 -->
  <line x1="230" y1="95" x2="273" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="252" y="88" text-anchor="middle" font-size="11" fill="#333">p̄, u, ŝ</text>
  <line x1="525" y1="95" x2="568" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="547" y="88" text-anchor="middle" font-size="11" fill="#333">조치</text>

  <!-- 서비스 사슬 -->
  <text x="20" y="232" font-size="13" font-weight="700" fill="#333">서비스</text>
  <rect x="80" y="250" width="110" height="44" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="135" y="277" text-anchor="middle" font-size="13" fill="#222">gateway</text>
  <rect x="240" y="250" width="110" height="44" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="295" y="277" text-anchor="middle" font-size="13" fill="#222">orders</text>
  <rect x="400" y="250" width="110" height="44" rx="6" fill="#ffffff" stroke="#b03a2e" stroke-width="1.8"/>
  <text x="455" y="277" text-anchor="middle" font-size="13" fill="#222">payment</text>
  <rect x="560" y="250" width="120" height="44" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.4"/>
  <text x="620" y="277" text-anchor="middle" font-size="13" fill="#222">PostgreSQL</text>
  <line x1="190" y1="272" x2="238" y2="272" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="350" y1="272" x2="398" y2="272" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="510" y1="272" x2="558" y2="272" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="455" y="315" text-anchor="middle" font-size="11" fill="#b03a2e">장애 주입 지점 (S1: DB 커넥션 고갈, S3: 지연)</text>

  <!-- 지표 수집 (사슬 → 예측) -->
  <path d="M 135 250 L 135 172" fill="none" stroke="#3a5a8c" stroke-width="1.4" stroke-dasharray="5 3"
        marker-end="url(#arrow)"/>
  <text x="142" y="208" font-size="11" fill="#3a5a8c">모든 노드의 지표</text>
  <text x="142" y="222" font-size="11" fill="#3a5a8c">(5초 주기 수집)</text>

  <!-- 조치 적용 (실행 → 호출자 / 노드 자신) -->
  <path d="M 610 170 L 610 200 L 295 200 L 295 248" fill="none" stroke="#2f7a45" stroke-width="1.4"
        marker-end="url(#arrow)"/>
  <text x="300" y="194" font-size="11" fill="#2f7a45">CB · 벌크헤드 (호출자)</text>
  <path d="M 700 170 L 700 222 L 470 222 L 470 248" fill="none" stroke="#2f7a45" stroke-width="1.4"
        stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="560" y="216" font-size="11" fill="#2f7a45">증설 (자신)</text>
</svg>
